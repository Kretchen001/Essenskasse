    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />

    <link rel="apple-touch-icon" sizes="128x128" href="icon-128.png" />

</head>


    <body>
        <div id="app">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>

        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href="" class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>
        <script src="_framework/blazor.webassembly.js"></script>
        <script src="js/person.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/update.js"></script>

        <script>
            window.SetDocumentLanguage = (language) => {
                window.document.documentElement.lang = language;
            }

            window.ChangeTheme = (colorCode, oldColorCode) => {
                switch (colorCode) {
                    case "Light": {
                        window.document.body.classList.remove(oldColorCode);
                        window.document.body.classList.add("Light");
                        break;
                    }
                    case "Dark": {
                        window.document.body.classList.remove(oldColorCode);
                        window.document.body.classList.add("Dark");
                        break;
                    }
                }
            }
        </script>

        <script>
            blazorExtensions = {
                SendLocalEmail: function (mailto, subject, body) {
                    var link = document.createElement('a');
                    // Betreff und Text werden vollstaendig kodiert (sonst brechen &, # und ? die Adresse).
                    // Zu lange Texte (mehrsprachige Mails) werden am Ende gekuerzt, nie mitten in einem Zeichen.
                    var maxLength = 8000;
                    var text = isEmpty(body) ? "" : body;
                    var cut = false;
                    var uri;
                    while (true) {
                        uri = "mailto:" + encodeURI(mailto) + "?";
                        if (!isEmpty(subject)) {
                            uri += "subject=" + encodeURIComponent(subject);
                        }
                        if (text.length > 0) {
                            uri += (!isEmpty(subject) ? "&" : "") + "body=" + encodeURIComponent(cut ? text + "\u2026" : text);
                        }
                        if (uri.length <= maxLength || text.length === 0) {
                            break;
                        }
                        var over = uri.length - maxLength;
                        text = text.substring(0, Math.max(0, text.length - Math.max(1, Math.ceil(over / 9))));
                        var last = text.charCodeAt(text.length - 1);
                        if (last >= 0xD800 && last <= 0xDBFF) {
                            text = text.substring(0, text.length - 1);
                        }
                        cut = true;
                    }

                    link.href = uri;
                    document.body.appendChild(link); // Needed for Firefox
                    link.click();
                    document.body.removeChild(link);
                }
            };

            function isEmpty(str) {
                return (!str || str.length === 0);
            }
        </script>
    </body>

</html>
