<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Essenskasse</title>
        <base href="/" />
        <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
        <link rel="stylesheet" href="css/app.css" />

        <link rel="icon" type="image/png" href="favicon.png" />
        <link href="Essenskasse.styles.css" rel="stylesheet" />
        <link href="manifest.webmanifest" rel="manifest" />
        <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
        <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    
        <style>
            body.Dark, .Dark button {
                color: #EEEEEE;
                background-color: #2D2D2D;
                border-color: #FFFFFF;
            }
            body.Light, .Light button {
                color: #000000;
                background-color: #FFFFFF;
                border-color: #000000;
            }
        </style>
    </head>


    <body>
        <div id="app">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>

        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href="" class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>
        <script src="_framework/blazor.webassembly.js"></script>
        <script>navigator.serviceWorker.register('service-worker.js');</script>

        <script>
            window.ChangeTheme = (colorCode, oldColorCode) => {
                switch (colorCode) {
                    case "Light": {
                        window.document.body.classList.remove(oldColorCode);
                        window.document.body.classList.add("Light");
                        break;
                    }
                    case "Dark": {
                        window.document.body.classList.remove(oldColorCode);
                        window.document.body.classList.add("Dark");
                        break;
                    }
                }
            }
        </script>
    </body>

</html>
