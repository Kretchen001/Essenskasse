    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />

    <link rel="apple-touch-icon" sizes="128x128" href="icon-128.png" />

</head>


    <body>
        <div id="app">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>

        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href="" class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>
        <script src="_framework/blazor.webassembly.js"></script>
        <script src="js/person.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/update.js"></script>

        <script>
            window.ChangeTheme = (colorCode, oldColorCode) => {
                switch (colorCode) {
                    case "Light": {
                        window.document.body.classList.remove(oldColorCode);
                        window.document.body.classList.add("Light");
                        break;
                    }
                    case "Dark": {
                        window.document.body.classList.remove(oldColorCode);
                        window.document.body.classList.add("Dark");
                        break;
                    }
                }
            }
        </script>

        <script>
            blazorExtensions = {
                SendLocalEmail: function (mailto, subject, body) {
                    var link = document.createElement('a');
                    var uri = "mailto:" + mailto + "?";
                    if (!isEmpty(subject)) {
                        uri = uri + "subject=" + subject;
                    }

                    if (!isEmpty(body)) {
                        if (!isEmpty(subject)) { // We already appended one querystring parameter, add the '&' separator
                            uri = uri + "&"
                        }

                        uri = uri + "body=" + body;
                    }

                    uri = encodeURI(uri);
                    uri = uri.substring(0, 2000); // Avoid exceeding querystring limits.
                    // console.log('Clicking SendLocalEmail link:', uri);

                    link.href = uri;
                    document.body.appendChild(link); // Needed for Firefox
                    link.click();
                    document.body.removeChild(link);
                }
            };

            function isEmpty(str) {
                return (!str || str.length === 0);
            }
        </script>
    </body>

</html>
