events {}
http {
    include mime.types;

    # dotnet publish legt zu jeder Datei eine vorkomprimierte .gz (und .br) ab. gzip_static liefert die .gz-Datei direkt aus,
    # ohne bei jeder Anfrage zu komprimieren. gzip ergaenzt Dateien ohne .gz (z. B. Antworten kleiner Konfigurationsdateien).
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json application/wasm text/css text/plain image/svg+xml;

    server {
        listen  80;
        root /usr/share/nginx/html;

        # Bilder und Schriften aendern sich selten: eine Woche im Browser behalten.
        location ~* \.(png|jpe?g|gif|ico|svg|woff2?)$ {
            add_header Cache-Control "public, max-age=604800";
        }

        # Alles andere (Programmdateien, index.html, Service Worker, Konfiguration) wird bei jedem Aufruf nur auf Aenderung
        # geprueft (ETag, Antwort 304 ohne Inhalt). Die Dateinamen enthalten keine Versionsnummer, daher kein langes Caching:
        # sonst bleibt nach einem Update die alte Version haengen. Dauerhaft offline vorhalten tut der Service Worker.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html =404;
        }
    }
}
