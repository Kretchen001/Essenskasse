events {}
http {
    include mime.types;
    server {
        listen  80;

        # Diese Dateien muessen bei jedem Aufruf neu geprueft werden, sonst bleibt nach einem Update die alte Version haengen.
        location ~ ^/(service-worker\.js|service-worker-assets\.js|appsettings\.json|index\.html)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html =404;
        }
    }
}