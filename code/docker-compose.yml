version: '3.4'

services:

  pwa:
    container_name: EssenskassePWA
    build:
      context: .
      dockerfile: Essenskasse/Dockerfile
    ports:
      - 8009:80

  api:
    container_name: EssenskasseAPI
    build: 
      context: .
      dockerfile: EssenskasseAPI/Dockerfile
    ports:
      - 8010:8080

