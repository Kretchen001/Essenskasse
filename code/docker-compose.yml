version: '3.4'

services:
  database:
    container_name: EssenskasseDB
    image: mysql:8.0.2
    environment:
        MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
        MYSQL_DATABASE: "${DB_DATABASE}"
        MYSQL_USER: "${DB_USERNAME}"
        MYSQL_PASSWORD: "${DB_PASSWORD}"
        MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - dbdata:/var/lib/mysql
      - ./MySqlScripts/init.sql:/docker-entrypoint-initdb.d/1.sql:ro # 1 weil damit als erstes ausgefüht, alle anderen danach (wenn welche da sind)
      # - ./MySqlScripts/demoData.sql:/docker-entrypoint-initdb.d/2.sql:ro
    restart: always
    healthcheck:
      # Im Image mysql:8.0.2 gibt es kein mysqladmin; geprueft wird daher, ob der Server den TCP-Port annimmt
      # (waehrend der Initialisierung laeuft nur ein Server ohne Netzwerk, der Port ist dann noch zu).
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/3306'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      # nur lokal erreichbar (z. B. fuer einen SQL-Client oder die lokal gestartete API); die API im Container nutzt "database:3306"
      - 127.0.0.1:8008:3306
    command: --default-authentication-plugin=mysql_native_password

  pwa:
    container_name: EssenskassePWA
    image: essenskassepwa
    restart: always
    build:
      context: .
      dockerfile: Essenskasse/Dockerfile
    ports:
      - 8009:80
    depends_on:
      - database

  api:
    container_name: EssenskasseAPI
    image: essenskasseapi
    restart: always
    build: 
      context: .
      dockerfile: EssenskasseAPI/Dockerfile
    ports:
      - 8010:8080
    environment:
      # ueberschreibt den Connection String aus der appsettings.json, damit der Container unabhaengig von der lokalen Entwicklungs-Konfiguration ist
      ConnectionStrings__essenskasse: "Server=database;Port=3306;Uid=${DB_USERNAME};Pwd=${DB_PASSWORD};Database=${DB_DATABASE};SslMode=None;"
    depends_on:
      database:
        condition: service_healthy

volumes:
  dbdata:
